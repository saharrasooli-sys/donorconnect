<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DonorConnect Admin</title><link rel="icon" href="favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
body{display:flex;min-height:100vh}#side{width:230px;background:var(--dk);color:#fde8ec;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
#side b{font:800 20px Fraunces,serif;display:flex;gap:8px;align-items:center;margin-bottom:18px}#side a{color:#fde8ec;text-decoration:none;padding:11px 14px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
#side a:hover{background:rgba(255,255,255,.12)}#side a.on{background:var(--red)}#main{flex:1;padding:24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.top h1{font-size:32px;margin-inline-end:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{padding:18px}.kpi b{font:800 34px Fraunces,serif;color:var(--red);display:block}.kpi span{color:var(--mut);font-weight:700;font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.g2>*{min-width:0}.g2 canvas{max-width:100%}
.tb{width:100%;border-collapse:collapse;min-width:640px}.tb th,.tb td{width:auto;height:auto;text-align:start;padding:10px;border-bottom:1px solid var(--line);font-size:14px;border-radius:0}
.tb th{color:var(--mut);cursor:default}.sm{border:0;border-radius:10px;padding:6px 10px;font:inherit;font-weight:800;font-size:12px;cursor:pointer;background:var(--soft);color:var(--red);margin-inline-end:4px}.sm.d{background:var(--red);color:#fff}
.st{font-size:12px;font-weight:800;border-radius:8px;padding:2px 9px;background:var(--soft)}.st.verified{background:#e6f7ec;color:#14803c}.st.suspended{background:#fde2e2;color:var(--red)}
.hm td{width:52px;height:38px;font-size:13px}#lg{min-height:100vh;display:grid;place-items:center;width:100%}#lg .card{width:min(380px,92vw)}#lg input{margin:6px 0 12px}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99}
@media(max-width:860px){body{flex-direction:column}#side{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row;overflow-x:auto;z-index:50;padding:8px}#side b,#side .sp{display:none}#side a{padding:9px 12px;font-size:12px;flex-direction:column;gap:2px}#main{padding:16px 14px 90px}.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:600px){#side{gap:2px;padding:6px}#side a{flex:0 0 auto;padding:8px 10px;font-size:11px}#side>a[href="/"]{display:none}#main{padding:14px 12px 82px}.top h1{font-size:27px}.kpis{gap:9px}.kpi{padding:13px}.kpi b{font-size:28px}.kpi span{font-size:12px}.card{padding:16px;border-radius:20px}.tb{min-width:580px}.hm td{width:42px}}
@media(max-width:380px){#side a{padding:7px 8px;font-size:10px}#main{padding-inline:9px}.kpis{gap:7px}}
</style></head><body><div id="root" style="display:contents"></div>
<script>
const $=s=>document.querySelector(s),T=["O-","O+","A-","A+","B-","B+","AB-","AB+"],d=x=>x.replace("-","−"),PR=["Kabul","Herat","Balkh","Kandahar","Nangarhar","Bamyan","Paktia","Badakhshan"];
const ic=p=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',siren:'<path d="M6 18v-5a6 6 0 0 1 12 0v5M4 18h16M12 3v2"/>',alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.01"/>',log:'<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>'};
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)};
async function api(u,o={}){const r=await fetch("/api/admin"+u,{headers:{"Content-Type":"application/json"},...o});if(r.status===401&&u!=="/login"){login();throw 0}let j;try{j=await r.json()}catch(e){throw"Server error ("+r.status+"). The backend is not running."}if(!r.ok)throw j.error;return j}
function login(){document.body.innerHTML=`<div id="lg"><div class="card"><h2 style="font-size:30px;margin-bottom:6px">DonorConnect <em style="color:var(--red);font-style:normal">Admin</em></h2><p style="color:var(--mut);margin-bottom:14px">Authorised staff only.</p><input id="em" placeholder="Email" value="admin@donorconnect.af"><input id="pw" type="password" placeholder="Password"><button class="btn p" style="width:100%;justify-content:center" id="go">Sign in</button><p id="er" style="color:var(--red);font-weight:800;margin-top:10px"></p></div></div>`;
 $("#go").onclick=async()=>{try{await api("/login",{method:"POST",body:JSON.stringify({email:$("#em").value,password:$("#pw").value})});shell()}catch(e){$("#er").textContent=e}}}
const PAGES=[["home","Overview",over],["user","Donors",donors],["siren","Requests",reqs],["alert","Shortages",short],["log","Audit log",aud]];let cur=0,charts=[];
function shell(){document.body.innerHTML=`<aside id="side"><b><img src="favicon.svg" width="30">DonorConnect</b>${PAGES.map((p,i)=>`<a data-i="${i}">${ic(I[p[0]])}${p[1]}</a>`).join("")}<a href="/">← Back to website</a><span class="sp" style="flex:1"></span><a id="lo">${ic(I.out)}Sign out</a></aside><main id="main"></main>`;
 document.querySelectorAll("#side a[data-i]").forEach(a=>a.onclick=()=>go(+a.dataset.i));$("#lo").onclick=async()=>{await api("/logout",{method:"POST"});login()};go(0)}
function go(i){cur=i;charts.forEach(c=>c.destroy());charts=[];document.querySelectorAll("#side a[data-i]").forEach(a=>a.classList.toggle("on",+a.dataset.i===i));$("#main").innerHTML=`<div class="top"><h1>${PAGES[i][1]}</h1></div><div id="pg" class="rv in"></div>`;PAGES[i][2]()}
const count=(e,n)=>{let v=0;const s=Math.max(1,Math.ceil(n/30)),t=setInterval(()=>{v=Math.min(n,v+s);e.textContent=v;v>=n&&clearInterval(t)},25)};
async function over(){const s=await api("/stats");$("#pg").innerHTML=`<div class="kpis">${[["Total donors",s.total],["Verified",s.verified],["Open requests",s.open],["Fulfilled",s.fulfilled]].map(k=>`<div class="card kpi"><b data-n="${k[1]}">0</b><span>${k[0]}</span></div>`).join("")}</div>
<div class="g2"><div class="card"><h3>Donors by blood type</h3><canvas id="c1"></canvas></div><div class="card"><h3>Donors by province</h3><canvas id="c2"></canvas></div></div>
<div class="card"><h3 style="margin-bottom:10px;color:var(--red)">Critical shortages (fewer than 3 verified compatible donors)</h3>${s.shortage.length?s.shortage.map(x=>`<span class="st" style="margin:3px;display:inline-block">${d(x.type)} · ${x.province} · ${x.count}</span>`).join(""):"None"}</div>`;
 document.querySelectorAll("[data-n]").forEach(e=>count(e,+e.dataset.n));const red=["#6b0f24","#9c1432","#d90b2b","#f0384f","#e0566b","#c4304a","#a3203a","#7d1530"];
 charts.push(new Chart($("#c1"),{type:"doughnut",data:{labels:T.map(d),datasets:[{data:T.map(t=>s.by_type[t]),backgroundColor:red}]}}),new Chart($("#c2"),{type:"bar",data:{labels:Object.keys(s.by_province),datasets:[{data:Object.values(s.by_province),backgroundColor:"#d90b2b",borderRadius:8}]},options:{plugins:{legend:{display:false}}}}))}
let q={type:"",province:"",status:"",q:"",offset:0};
async function donors(){const o=(a,k)=>a.map((x,i)=>`<option value="${k?i:x}" ${String(q[k?"province":"type"])===String(k?i:x)?"selected":""}>${k?x:d(x)}</option>`).join("");
 $("#pg").innerHTML=`<div class="card"><div class="row" style="margin-bottom:12px"><input id="fq" placeholder="Search name" value="${q.q}"><select id="ft"><option value="">All types</option>${o(T)}</select><select id="fp"><option value="">All provinces</option>${o(PR,1)}</select><select id="fs"><option value="">All status</option>${["pending","verified","suspended"].map(s=>`<option ${q.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="scroll"><table class="tb" id="dt"></table></div><div id="pgn" style="margin-top:12px"></div></div>`;
 const reload=()=>{q={type:$("#ft").value,province:$("#fp").value,status:$("#fs").value,q:$("#fq").value,offset:0};donors()};["ft","fp","fs"].forEach(i=>$("#"+i).onchange=reload);$("#fq").onchange=reload;
 const r=await api("/donors?"+new URLSearchParams({...q,limit:15}));
 $("#dt").innerHTML=`<tr><th>Name</th><th>Type</th><th>Province</th><th>Phone</th><th>Status</th><th></th></tr>`+r.items.map(x=>`<tr><td>${x.full_name}</td><td><b>${d(x.blood_type)}</b></td><td>${x.province}</td><td id="p${x.id}">${x.phone}</td><td><span class="st ${x.status}">${x.status}</span></td><td><button class="sm" onclick="rev(${x.id})">Reveal</button><button class="sm" onclick="st(${x.id},'verified')">Verify</button><button class="sm" onclick="st(${x.id},'suspended')">Suspend</button><button class="sm d" onclick="del(${x.id})">Delete</button></td></tr>`).join("");
 $("#pgn").innerHTML=`${r.total} donors <button class="sm" ${q.offset?"":"disabled"} id="pv">Prev</button><button class="sm" ${q.offset+15<r.total?"":"disabled"} id="nx">Next</button>`;$("#pv").onclick=()=>{q.offset-=15;donors()};$("#nx").onclick=()=>{q.offset+=15;donors()}}
async function rev(i){$("#p"+i).textContent=(await api(`/donors/${i}/phone`)).phone;toast("Phone reveal logged")}
async function st(i,s){await api("/donors/"+i,{method:"PATCH",body:JSON.stringify({status:s})});toast("Updated");donors()}
async function del(i){if(confirm("Delete this donor?")){await api("/donors/"+i,{method:"DELETE"});toast("Deleted");donors()}}
async function reqs(){const r=await api("/requests");$("#pg").innerHTML=r.map(x=>`<div class="card req ${x.urgency==="urgent"?"":"s"}" style="margin-bottom:12px"><div class="t">${d(x.blood_type)}</div><div><p>${x.hospital||"Hospital"} · ${x.province}</p><small>${x.units} units · <span class="st">${x.status}</span></small><div id="m${x.id}"></div></div><span class="u">${x.urgency}</span><div style="margin-inline-start:12px"><button class="sm" onclick="mt(${x.id})">Find donors</button><select style="width:auto;padding:5px" onchange="rs(${x.id},this.value)">${["open","matched","fulfilled","expired","rejected"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></div></div>`).join("")}
async function mt(i){const m=await api(`/requests/${i}/matches`);$("#m"+i).innerHTML=m.length?m.map(x=>`<span class="st verified" style="margin:3px;display:inline-block">${x.name} · ${d(x.type)} · ${x.days}d</span>`).join(""):"<small>No eligible donors in this province.</small>"}
async function rs(i,s){await api("/requests/"+i,{method:"PATCH",body:JSON.stringify({status:s})});toast("Request updated")}
async function short(){const s=await api("/stats"),c=n=>n===0?"background:#d90b2b;color:#fff":n<3?"background:#ffb5c0":n<8?"background:#ffe9ed":"background:#e6f7ec;color:#14803c";
 $("#pg").innerHTML=`<div class="card"><p style="color:var(--mut);margin-bottom:12px">Verified donors who can give to each patient type, per province.</p><div class="scroll"><table class="hm"><tr><th>Patient</th>${s.provinces.map(p=>`<th>${p.slice(0,5)}</th>`).join("")}</tr>${T.map(t=>`<tr><th>${d(t)}</th>${s.matrix[t].map(n=>`<td style="${c(n)}">${n}</td>`).join("")}</tr>`).join("")}</table></div></div>`}
async function aud(){const r=await api("/audit");$("#pg").innerHTML=`<div class="card scroll"><table class="tb"><tr><th>When</th><th>Action</th><th>Entity</th><th>Detail</th></tr>${r.map(x=>`<tr><td>${x.created_at}</td><td>${x.action}</td><td>${x.entity} #${x.entity_id||""}</td><td>${x.detail||""}</td></tr>`).join("")}</table></div>`}
api("/me").then(shell).catch(login);
</script></body></html>
